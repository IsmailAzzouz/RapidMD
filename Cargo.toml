[package]
name = "rustdown-viewer"
version = "0.1.0"
edition = "2021"
description = "RustDownViewer — native cross-platform Markdown viewer & editor (Rust)"
license = "MIT"

[[bin]]
name = "rapidmd"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
pulldown-cmark = "0.13"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
rfd = "0.17"
arboard = "3"
open = "5"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dark-light = "3"
memmap2 = "0.9"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
