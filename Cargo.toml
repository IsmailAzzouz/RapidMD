[package]
name = "rustdown-viewer"
version = "0.1.0"
edition = "2021"
description = "RustDownViewer — native cross-platform Markdown viewer & editor (Rust)"
license = "MIT"

[[bin]]
name = "rustdown"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
pulldown-cmark = "0.12"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
rfd = "0.15"
arboard = "3"
open = "5"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dark-light = "1"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
